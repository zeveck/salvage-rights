<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Teko'; src: url('../game/fonts/Teko.woff2') format('woff2'); font-weight: 300 700; }
@font-face { font-family: 'Rajdhani'; src: url('../game/fonts/Rajdhani-Bold.woff2') format('woff2'); font-weight: 700; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0c0d10; }
.bg { position: absolute; inset: 0; background: url('screenshots/card-robot.png') center / cover; }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,9,11,0.92) 0%, rgba(8,9,11,0.72) 34%, rgba(8,9,11,0) 62%); }
.t { position: absolute; left: 60px; top: 150px; font-family: 'Teko', sans-serif; font-weight: 700; font-size: 176px; line-height: 0.82; color: #eef2f5; text-shadow: 0 4px 0 rgba(0,0,0,0.6); }
.t em { display: block; font-style: normal; color: #ff6a13; }
.s { position: absolute; left: 62px; top: 460px; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 36px; color: #ffc21a; }
</style>
</head>
<body>
<div class="bg"></div><div class="shade"></div>
<div class="t">SALVAGE<em>RIGHTS</em></div>
<div class="s">Beat them. Strip them. Bolt it on.</div>
</body>
</html>
